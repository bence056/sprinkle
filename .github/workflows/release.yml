name: Release

on:
  push:
    tags: 
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo at tag
        uses: actions/checkout@v6.0.2
        
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Create build folder
        run: |
          mkdir -p .github/build/sprinkle

          cp -r ./* .github/build/sprinkle/

          rm -rf .github/build/sprinkle/frontend/*

          cp ./frontend/dist/sprinkle-panel.js .github/build/sprinkle/frontend/

      - name: Create Release
        run: |
          mkdir -p release/custom_components/
          cp -r .github/build/sprinkle release/custom_components/

      - name: Package project for release
        run: |
          cd release/
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ZIP_NAME=${TAG_NAME#v}
          zip -r ./sprinkle-${ZIP_NAME}.zip .

      - uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./release/sprinkle-*.zip
          draft: true